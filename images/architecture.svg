<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Band 1: Ingestion -->
  <text x="20" y="28" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="0.5">1 · INGESTION — RUNS ONCE</text>

  <rect x="20" y="45" width="160" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="100" y="68" font-size="12.5" text-anchor="middle" fill="#1e3a5f">
    <tspan x="100">Codex · eCFR</tspan>
    <tspan x="100" dy="16">FSIS documents</tspan>
  </text>

  <rect x="200" y="45" width="160" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="280" y="68" font-size="12.5" text-anchor="middle" fill="#1e3a5f">
    <tspan x="280">Chunk by section,</tspan>
    <tspan x="280" dy="16">keep citations</tspan>
  </text>

  <rect x="380" y="45" width="160" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="460" y="68" font-size="12.5" text-anchor="middle" fill="#1e3a5f">
    <tspan x="460">Embed locally</tspan>
    <tspan x="460" dy="16">→ Qdrant</tspan>
  </text>

  <line x1="180" y1="73" x2="196" y2="73" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="73" x2="376" y2="73" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Qdrant feeds retrieval -->
  <path d="M 460 101 L 460 128 L 280 128 L 280 151" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Band 2: Answering -->
  <text x="20" y="138" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="0.5">2 · ANSWERING A QUESTION</text>

  <rect x="20" y="155" width="160" height="56" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="100" y="188" font-size="12.5" text-anchor="middle" fill="#14532d">User question</text>

  <rect x="200" y="155" width="160" height="56" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="280" y="178" font-size="12.5" text-anchor="middle" fill="#14532d">
    <tspan x="280">Hybrid search</tspan>
    <tspan x="280" dy="16">vector + BM25 · RRF</tspan>
  </text>

  <rect x="380" y="155" width="160" height="56" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="460" y="178" font-size="12.5" text-anchor="middle" fill="#14532d">
    <tspan x="460">Gemini flash-lite</tspan>
    <tspan x="460" dy="16">+ relevance check</tspan>
  </text>

  <rect x="560" y="155" width="160" height="56" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="640" y="178" font-size="12.5" text-anchor="middle" fill="#14532d">
    <tspan x="640">Answer with</tspan>
    <tspan x="640" dy="16">citations</tspan>
  </text>

  <line x1="180" y1="183" x2="196" y2="183" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="183" x2="376" y2="183" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="183" x2="556" y2="183" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Answer + feedback logged -->
  <path d="M 640 211 L 640 238 L 460 238 L 460 261" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Band 3: Monitoring -->
  <text x="20" y="248" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="0.5">3 · MONITORING</text>

  <rect x="380" y="265" width="160" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="460" y="288" font-size="12.5" text-anchor="middle" fill="#78350f">
    <tspan x="460">Postgres</tspan>
    <tspan x="460" dy="16">answers + feedback</tspan>
  </text>

  <rect x="560" y="265" width="160" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="640" y="298" font-size="12.5" text-anchor="middle" fill="#78350f">Grafana dashboard</text>

  <line x1="540" y1="293" x2="556" y2="293" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
